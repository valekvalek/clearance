<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>Clearance AI · вход</title>
<script>
  // тема выставляется ДО отрисовки — иначе страница на миг мигает светлым/тёмным
  try {
    var _t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', _t);
  } catch (e) {}
</script>
<style>
/* Тот же стиль, что у приложения (taste-skill, framed-sheet): тонированный фон, белый лист без тени. */
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/IBMPlexSans-var-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/IBMPlexSans-var-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ground:#f9fbfc;--surface:#ffffff;--border:#e8eaec;--control:#cdced1;--text:#131416;--muted:#5d5f60;
  --accent:#1b6c80;--primary:#131416;--primary-ink:#ffffff;--negative:#c4242a;--raised:#f4f6f8}
:root[data-theme="dark"]{--ground:#0c0d0e;--surface:#151718;--border:#25292b;--control:#3c4144;--text:#f2f3f3;--muted:#a9adaf;
  --accent:#5fb3c8;--primary:#f2f3f3;--primary-ink:#0c0d0e;--negative:#e5566f;--raised:#1d2022}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--ground);color:var(--text);font:14px/20px "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin:0 0 16px 4px}
.brand svg{width:22px;height:22px}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
h1{margin:0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-0.01em}
.sub{margin:4px 0 24px;color:var(--muted)}
label{display:block;font-weight:500;margin:0 0 8px}
input{display:block;width:100%;height:40px;padding:0 12px;margin:0 0 16px;border:1px solid var(--control);border-radius:6px;background:var(--surface);color:var(--text);font:inherit}
button{width:100%;height:40px;margin-top:8px;border:0;border-radius:6px;background:var(--primary);color:var(--primary-ink);font:inherit;font-weight:500;cursor:pointer;transition:opacity 150ms ease}
button:hover{opacity:.9}
.err{color:var(--negative);min-height:20px;margin-top:12px}
.foot{margin:16px 4px 0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M5 2.75h8.5L18 7.25v12H5z" fill="none" style="stroke:var(--accent)" stroke-width="1.5" stroke-linejoin="round"/><path d="M13.5 2.75v4.5H18" fill="none" style="stroke:var(--accent)" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 13.25l2.25 2.25L15 10.75" fill="none" style="stroke:var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Clearance AI
    </div>
    <form class="sheet" id="f">
      <h1>Вход</h1>
      <p class="sub">Обработка китайских инвойсов: перевод товаров и коды ТН ВЭД.</p>
      <label for="u">Логин</label>
      <input id="u" autocomplete="username" autofocus>
      <label for="p">Пароль</label>
      <input id="p" type="password" autocomplete="current-password">
      <button type="submit">Войти</button>
      <div class="err" id="e" role="alert"></div>
    </form>
    <p class="foot">Нет учётной записи? Её выдаёт администратор сервиса.</p>
  </div>
<script>
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  document.getElementById('e').textContent = '';
  const r = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:document.getElementById('u').value,
                          password:document.getElementById('p').value})});
  if (r.ok){ location.href = '/'; }
  else { const d=await r.json().catch(()=>({})); document.getElementById('e').textContent = d.detail || 'Ошибка входа'; }
};
</script>
</body>
</html>
